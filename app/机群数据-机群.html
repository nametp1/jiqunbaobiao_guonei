/* 数据窗口：400 天（约 13 个月，2025-08-16 ~ 2026-09-19）
   图表按 7 格出图（日 / 周 / 月），窗口留足 13 个月：覆盖最长的月口径之外还留了往回翻的余量
   （原来是 224 天，只能撑到近 7 个月） */
const DAYS = 400;

function buildDailyData(seed) {
    const arr = [];
    for (let d = 0; d < DAYS; d++) {
        const A = +(1.0 + ((seed + d * 2) % 14) / 10).toFixed(2);        // 怠速 A
        const B = +(3.0 + ((seed * 2 + d * 3) % 40) / 10).toFixed(2);    // 属具 B
        const C = +(1.5 + ((seed + d * 5) % 25) / 10).toFixed(2);        // 回转 C
        const D = +(0.4 + ((seed * 3 + d) % 15) / 10).toFixed(2);        // 行走 D
        const G = +(A * 5.2).toFixed(2);                                 // 怠速消耗 G
        const H = +(B * 6.8 + C * 5.4).toFixed(2);                       // 运行消耗 H
        arr.push({ A: A, B: B, C: C, D: D, G: G, H: H });
    }
    return arr;
}

const DATA = {};
MACHINES.forEach(m => { DATA[m.id] = buildDailyData(m.seed); });

/* ==================== 聚合引擎（与 PRD 4.9 一致） ==================== */
/* 日期 → 索引（与 dateOf 互逆） */
function idxOfDate(d) {
    const base = dateOf(0);
    const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    return Math.round((x - base) / 86400000);
}

/* 某个周期在窗口内的起始索引：日=当天；周=该周周日；月=当月 1 号 */
function periodStartIdx(period, endIdx) {
    if (period === 'day') return endIdx;
    if (period === 'week') return endIdx - ((dateOf(endIdx).getDay() + 6) % 7);   /* 周一~周日 */
    const d = dateOf(endIdx);
    return idxOfDate(new Date(d.getFullYear(), d.getMonth(), 1));
}

/* 周期内的「日数据行」：传一台设备 id 或一组 id（机群 = 多台并起来求和） */
function periodRows(machineOrIds, period, endIndex) {
    const ids = Array.isArray(machineOrIds) ? machineOrIds : [machineOrIds];
    const from = Math.max(0, periodStartIdx(period, endIndex));
    const out = [];
    ids.forEach(id => {
        const all = DATA[id] || [];
        for (let i = from; i <= endIndex; i++) if (all[i]) out.push(all[i]);
    });
    return out;
}

/* 期间求和：按组成字母（A/B/C/D/G/H）对每日数据求和 */
function sumParts(parts, rows) {
    return parts.reduce((s, p) => s + rows.reduce((s2, r) => s2 + (r[p] || 0), 0), 0);
}

/* 字段聚合规则：对一组「日」数据行求值（单周期与多周期合计共用）
   原子 / 派生 = 累加；比率（平均油耗等）= 分子分母分别累计后再相除，不能把比率直接相加 */
function applyField(def, rows) {
    if (!rows || rows.length === 0) return null;
    switch (def.type) {
        case 'atomic':
            return rows.reduce((s, r) => s + (r[def.key] || 0), 0);
        case 'derived':
            return sumParts(def.parts, rows);
        case 'recalc': {
            const num = def.n === 'GH' ? sumParts(['G', 'H'], rows) : sumParts([def.n], rows);
            const den = def.d === 'ABCD' ? sumParts(['A', 'B', 'C', 'D'], rows) : sumParts([def.d], rows);
            return den === 0 ? null : num / den;
        }
        default:
            return null;
    }
}

/* 单周期聚合（按字段可用性表过滤） */
function aggregate(machineOrIds, fieldKey, period, endIndex) {
    const def = FIELDS[fieldKey];
    if (!def) return null;
    const avail = def.avail[period];
    if (!avail || avail === 'noStat' || avail === 'hidden') return null;

    const rows = periodRows(machineOrIds, period, endIndex);
    if (rows.length === 0) return null;
    return applyField(def, rows);
}

function fmt(v, decimals) {
    if (v === null || v === undefined) return '--';
    const n = Number(v).toFixed(decimals === undefined ? 1 : decimals);
    return n.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}

/* ==================== 页面状态 ==================== */
let state = {
    period: 'day',
    machineId: 'EX001',            /* 已选第一台：头像 / 分享图等单点场景用（渲染时会同步） */
    machineIds: defaultSelection(),/* 已选设备集合（默认 10 台）—— 机群口径：KPI / 图表 / 明细都按这批设备汇总 */
    endIndex: DAYS - 1,
    startIndex: DAYS - 7,          /* 2026-10-18：开始周期（与 endIndex 组成区间，默认近 7 格） */
    pageState: 'data',
    chartView: {},                 /* 图表卡片视图：key → 'chart' | 'table'（默认图表；切周期不重置） */
    chartSort: {},                /* 数据台账排序：key → { col, dir }（图表明细表已不做排序） */
    xlsPage: {},                   /* 明细表当前页：key → page */
};

/* ==================== 日期与周期标签 ==================== */
function dateOf(idx) {
    // 数据窗口 30 天，最后一天为 2026-09-19（周六）→ 最近 7 天正好是 09-13（周日）～09-19（周六）一个自然周
    return new Date(2026, 8, 19 - (DAYS - 1 - idx));
}

/* 该日期所在自然周（周日~周六）的周日 0 点 */
/* 周的起点 = 周一（周一~周日为一周，非周日~周六） */
function weekStartOf(d) {
    const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    x.setDate(x.getDate() - ((x.getDay() + 6) % 7));   /* 周一 = 偏移 0 */
    return x;
}

/* 紧凑「月/日」：8/10（不带前导 0，周日期段用，避免标签过长） */
function mdShort(d) { return d.getMonth() + 1 + '/' + d.getDate(); }

/* 本月第几周（W 编号）：以「本月第一个周日」为第 1 周起点，与设计稿 2026/09 W4 口径一致 */
function weekNoOfMonth(d) {
    const first = new Date(d.getFullYear(), d.getMonth(), 1);
    const firstMonday = new Date(first.getFullYear(), first.getMonth(), first.getDate() + ((8 - first.getDay()) % 7));
    const n = Math.round((weekStartOf(d) - firstMonday) / 604800000) + 1;
    return n < 1 ? 1 : n;
}

function periodLabel() {
    const s = dateOf(state.startIndex), e = dateOf(state.endIndex);
    const ym = (d) => d.getFullYear() + '/' + String(d.getMonth() + 1).padStart(2, '0');
    if (state.period === 'day') {
        if (state.startIndex === state.endIndex) return ym(e) + '/' + String(e.getDate()).padStart(2, '0');
        return mdShort(s) + ' ~ ' + mdShort(e);
    }
    if (state.period === 'week') return ym(s) + ' W' + weekNoOfMonth(s) + ' ~ ' + ym(e) + ' W' + weekNoOfMonth(e);
    return ym(s) + ' ~ ' + ym(e);
}

/* ==================== 渲染：手机端适配器 ==================== */

/* 已选设备集合（机群口径）：兜底保证至少 1 台 */
function selIds() {
    const ids = (state.machineIds || []).filter(id => DATA[id]);
    return ids.length ? ids : [state.machineId];
}

/* 某一天在各已选设备上的数据行（多台 = 逐台相加） */
function dayRows(idx) {
    return selIds().map(id => (DATA[id] || [])[idx]).filter(Boolean);
}

function hoursOf(idx) {
    const rows = dayRows(idx);
    return rows.length ? rows.reduce((s, r) => s + r.A + r.B + r.C + r.D, 0) : null;
}

function fuelOf(idx) {
    const rows = dayRows(idx);
    return rows.length ? rows.reduce((s, r) => s + r.G + r.H, 0) : null;
}

/* 本周期内的日期索引 */
function periodIdxs() {
    const from = Math.max(0, periodStartIdx(state.period, state.endIndex));
    const out = [];
    for (let i = from; i <= state.endIndex; i++) out.push(i);
    return out;
}

/* 小时数 → 「H:MM」：工时一律按「时:分」显示，避免 1.5 这种小数（25.4h = 25:24） */
function hm(v) {
    if (v === null || v === undefined || isNaN(v)) return '--';
    const neg = v < 0;
    const total = Math.round(Math.abs(v) * 60);
    const h = Math.floor(total / 60);
    const m = total % 60;
    return (neg ? '-' : '') + h + ':' + String(m).padStart(2, '0');
}

/* 图表里的工时数值：十进制小时（13.3 / 5）—— 不用「时:分」，
   否则 1:18 这种容易被误读成时刻；明细表 / 指标卡仍按「时:分」显示保留精度 */
function h1(v) {
    if (v === null || v === undefined || isNaN(v)) return '--';
    return Math.round(v) === v ? String(v) : fmt(v, 1);
}

/* ==================== 图表工具（按《组件规则说明》取口径） ====================
   · 时间口径（规范默认）：日 / 周 / 月 一律 7 格（近 7 天 / 7 周 / 7 个月）
   · 机群柱状图 = 设备排行榜（时间塌缩：每台设备一个值）
   · 机群折线图 = 一台设备一条线（色相按设备序号铺开，同一个 Y 轴刻度）
   · 机群单次最多 10 台：图里只画前 10 台（演示资产 100 台），其它组件给全量 */
const CHART_NODES = { day: 7, week: 7, month: 7 };
/* 2026-10-18：开始/结束区间 → 图表格数（1~12 格） */
function spanNodes() {
    const n = Math.max(1, (state.endIndex || 0) - (state.startIndex || 0) + 1);
    return Math.min(12, n);
}
function syncNodes() { CHART_NODES[state.period] = spanNodes(); }

/* 近 N 格的「时间区间」（from~to 为日索引；只保留与数据窗口有交集的格子） */
function chartRanges() {
    const end = state.endIndex;
    const n = CHART_NODES[state.period] || 7;
    const out = [];
    if (state.period === 'week') {
        const wsEnd = end - ((dateOf(end).getDay() + 6) % 7);        /* 本周一 */
        for (let k = n - 1; k >= 0; k--) {
            const ws = wsEnd - k * 7;
            if (ws + 6 < 0) continue;                                /* 完全在窗口外 */
            out.push({
                label: mdShort(dateOf(ws)) + '-' + mdShort(dateOf(ws + 6)),
                from: Math.max(0, ws), to: Math.min(DAYS - 1, ws + 6)
            });
        }
    } else if (state.period === 'month') {
        const d = dateOf(end);
        for (let k = n - 1; k >= 0; k--) {
            const m = new Date(d.getFullYear(), d.getMonth() - k, 1);
            const last = new Date(m.getFullYear(), m.getMonth() + 1, 0);   /* 该月最后一天 */
            if (idxOfDate(last) < 0) continue;                            /* 整月都在窗口外 */
            out.push({
                /* 月标签统一「年/月」（YY/M，如 26/1），与单机页 / 规范一致 */
                label: String(m.getFullYear()).slice(2) + '/' + (m.getMonth() + 1),
                from: Math.max(0, idxOfDate(m)),
                to: Math.min(end, idxOfDate(last))
            });
        }
    } else {
        for (let k = n - 1; k >= 0; k--) {
            const i = end - k;
            if (i < 0) continue;
            out.push({ label: fmtMD(dateOf(i)), from: i, to: i });
        }
    }
    return out;
}

/* 估算标签宽度（字号 11px：中文约 11px/字、数字字母约 6.2px）—— 用于判断刻度要不要倾斜 */
function labelWidth(t) {
    let w = 0;
    Array.from(String(t)).forEach(c => { w += /[\u4e00-\u9fa5]/.test(c) ? 11 : 6.2; });
    return w;
}

/* 设备名缩略：超过 5 个字就截断成「长沙起重…」（图表刻度 / 图例 / 排行名 / 台账这类窄位用）
   —— 完整名称仍放在悬停气泡、标题属性与「选择设备」弹层里，不丢信息 */
const DEV_NAME_MAX = 5;
function shortDevName(n) {
    const cs = Array.from(String(n == null ? '' : n));
    return cs.length > DEV_NAME_MAX ? cs.slice(0, DEV_NAME_MAX - 1).join('') + '…' : String(n == null ? '' : n);
}

/* 设备编号缩略：前 4 位 + … + 后 4 位（编号太长，台账 / 表格里只留头尾）
   —— 短编号（≤8 位）原样返回，避免出现「头和尾叠在一起」的怪样子 */
function devNoShort(no) {
    const s = String(no == null ? '' : no);
    return s.length > 8 ? s.slice(0, 4) + '…' + s.slice(-4) : s;
}

/* 刻度抽稀步长：
   · 节点 > 24 → 按 ceil(n / 12) 抽到约 12 个
   · 斜排标签是平行线：相邻两条的垂直净距 ≈ 每格间距 × sin40°，格距不够就抽稀
     （中文设备名 / 长日期段约需 21px 的格距才不压叠）
   · 只少标刻度：数据点 / 柱体一根不少，且末点必有刻度 */
function labelStep(n, dense) {
    const band = 330 / n;
    const base = n > 24 ? Math.ceil(n / 12) : 1;
    return Math.max(base, dense ? Math.ceil(21 / band) : 1);
}


/* 折线取色（规范）：色相 = 序号 × 137.5°，再叠加明暗 / 浓淡两档 —— 确定性取色，同一台每次同色 */
function deviceColor(index) {
    const hue = (index * 137.5) % 360;
    const l = 46 + (index % 3) * 9;
    const s = 55 + (index % 2) * 25;
    return 'hsl(' + hue.toFixed(1) + ', ' + s + '%, ' + l + '%)';
}

/* 机群折线数据：每台已选设备一条线（parts = 取值的字母，如 ['G','H'] = 总能耗）
   已选超过 10 台时，只画「该指标最高的前 10 台」（与排行榜同思路），其余设备仍计入其它组件 */
function deviceLines(parts) {
    const ranges = chartRanges();
    return selIds().map(id => {
        const idx = MACHINES.findIndex(m => m.id === id);
        const rows = DATA[id] || [];
        let total = 0;
        const values = ranges.map(r => {
            let t = 0;
            for (let i = r.from; i <= r.to; i++) {
                const row = rows[i];
                if (row) parts.forEach(p => { t += row[p] || 0; });
            }
            total += t;
            return t;
        });
        return { name: (MACHINES[idx] || {}).name || id, color: deviceColor(idx < 0 ? 0 : idx), values: values, total: total };
    })
        .sort((a, b) => b.total - a.total)
        .slice(0, CHART_TOP_N);
}

/* 机群折线图：N 台设备共用一套刻度（不区分离群设备、不加峰值角标），图例即设备名称。
   密度规则（对齐《折线图节点密度示例》）：
   · 节点 >10 → X 刻度倾斜 40° 且绘图区加高（否则刻度会被裁）
   · 节点 >24 → 刻度按步长抽稀到约 12 个，数据点一根不少，末点必有刻度
   · Y 轴按数据整体区间自适应（上下各留 12% 余量），不强制从 0 起，否则多台设备的差异看不出来
   · 多台设备「淡色铺底」：细线 + 半透明，避免 10+ 条线糊成一片 */
function multiLineChartHTML(labels, series, unit, vf, axisUnit) {
    const n = labels.length || 1;
    /* 刻度是否倾斜：按「最长标签宽（字符数 × 6.2px）＋ 间隙」是否放得下每格宽度判定
       （手机端绘图区按 330px 估）—— 设备名称（中文）、8 个周区间都会自动倾斜，7 个日期则水平排 */
    const band = 330 / n;
    const dense = Math.max.apply(null, labels.map(labelWidth)) + 4 > band;
    const step = labelStep(n, dense);
    const all = series.reduce((a, s) => a.concat(s.values), []);
    const mn = Math.min.apply(null, all);
    const mx = Math.max.apply(null, all);
    const span = (mx - mn) || 1;
    const hi = mx + span * 0.12;
    /* 下界：数据全为非负（工时 / 油耗）时夹到 0 —— 自适应能放大差异，但不该长出负刻度 */
    const lo = mn >= 0 ? Math.max(mn - span * 0.12, 0) : mn - span * 0.12;
    const ticks = [];
    for (let i = 6; i >= 0; i--) ticks.push(lo + (hi - lo) * i / 6);
    const grid = ticks.map((t, i) =>
        `<i class="${i === 0 ? 'top' : ''}" style="top:${(i / 6 * 100).toFixed(2)}%"></i>`).join('');
    /* 平滑曲线：Catmull-Rom 转三次贝塞尔（与原来单折线同一套算法） */
    const cl = v => Math.max(0, Math.min(100, v)).toFixed(2);
    const Y = v => 100 - ((v || 0) - lo) / (hi - lo) * 100;
    const paths = series.map(se => {
        const pts = se.values.map((v, i) => [(i + 0.5) / n * 100, Math.max(0, Math.min(100, Y(v)))]);
        let d = '';
        if (pts.length) {
            d = 'M' + pts[0][0].toFixed(2) + ' ' + pts[0][1].toFixed(2);
            for (let i = 0; i < pts.length - 1; i++) {
                const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
                const c1x = p1[0] + (p2[0] - p0[0]) / 6, c1y = p1[1] + (p2[1] - p0[1]) / 6;
                const c2x = p2[0] - (p3[0] - p1[0]) / 6, c2y = p2[1] - (p3[1] - p1[1]) / 6;
                d += ' C' + cl(c1x) + ' ' + cl(c1y) + ',' + cl(c2x) + ' ' + cl(c2y)
                    + ',' + p2[0].toFixed(2) + ' ' + p2[1].toFixed(2);
            }
        }
        return `<path d="${d}" style="stroke:${se.color};stroke-width:.7;opacity:.45" vector-effect="non-scaling-stroke"/>`;
    }).join('');
    const legend = series.map(se =>
        `<span class="lg-item" title="${se.name}"><i class="lg-dot" style="background:${se.color}"></i>${shortDevName(se.name)}</span>`).join('');
    /* 悬停热区：每格一整条（全高）。气泡里按图例顺序列出「该格里所有设备」的数值 + 合计
       —— 一格一次，不逐点弹；也省掉了几十个点位标记 */
    const hoverCols = labels.map((t, i) => {
        const edge = i === 0 ? ' edge-l' : (i === n - 1 ? ' edge-r' : '');
        /* 该格全部设备都列（不聚合），顺序与图例一致；单列竖排（见 .tip-list） */
        const rows = series.map(se =>
            `<span class="tip-row"><i class="lg-dot" style="background:${se.color}"></i>`
            + `<span class="tip-name" title="${se.name}">${shortDevName(se.name)}</span>`
            + `<span class="tip-val">${vf(se.values[i])}${unit ? ' ' + unit : ''}</span></span>`).join('');
        const sum = series.reduce((a, se) => a + (se.values[i] || 0), 0);
        return `<div class="chart-col tp${edge}" onclick="toggleBarTip(event, this)">
            <span class="chart-tip tip-wide">
                <span class="t-s">${t}</span>
                <span class="tip-list">${rows}</span>
                <span class="tip-sum">合计 ${vf(sum)}${unit ? ' ' + unit : ''}</span>
            </span>
        </div>`;
    }).join('');
    const xs = labels.map((t, i) => {
        if (step > 1 && (n - 1 - i) % step !== 0) return '<span></span>';       /* 抽稀：不标刻度但保留数据点 */
        return `<span${dense ? ' class="tilt"' : ''}>${t}</span>`;
    }).join('');
    const cols = `grid-template-columns:repeat(${n},minmax(0,1fr))`;
    /* 斜排刻度需要更高的绘图区与更宽的底部留白（否则标签被裁） */
    const plotH = dense ? 250 : 220;
    const bottom = dense ? 70 : 48;
    return `<div class="chart-legend">${legend}</div>
    <div class="chart-wrap">
        ${(axisUnit || unit) ? `<span class="chart-unit">${axisUnit || unit}</span>` : ''}
        <div class="chart-y" style="padding-bottom:${bottom}px">${ticks.map(t => `<span>${vf(t)}</span>`).join('')}</div>
        <div class="chart-plot" style="height:${plotH}px">
            <div class="chart-area" style="bottom:${bottom}px">
                <div class="chart-grid">${grid}</div>
                <svg class="chart-line" viewBox="0 0 100 100" preserveAspectRatio="none">
                    ${paths}
                </svg>
                <div class="chart-bars line-mode" style="${cols};gap:0">${hoverCols}</div>
            </div>
            <div class="chart-x" style="${cols};height:${bottom}px;gap:0;padding:0">${xs}</div>
        </div>
    </div>`;
}

/* 机群柱状图（设备排行榜）：水平条形，按第 1 指标降序、全量不截断、条端标数值。
   单指标 → 统一品牌红；条与隐形占位用 flex 比例分配「轨宽 − 数值宽」的可用空间
   → 数值紧贴条尾，最大值那条的数值正好落在行右端（右侧零残留空白），小值按比例缩 */
function rankChartHTML(rows, unit, vf, metric) {
    const max = Math.max.apply(null, rows.map(r => r.value).concat([0])) || 1;
    return `<div class="rank-list">${rows.map(r => {
        const ratio = Math.max(0.015, r.value / max);
        const rest = Math.max(0.0001, 1 - ratio);
        return `<div class="rank-row tp" onclick="toggleBarTip(event, this)">
            <span class="rk-name" title="${r.name}">${shortDevName(r.name)}</span>
            <span class="rk-track">
                <i class="rk-bar" style="flex:${ratio.toFixed(4)} 1 0"></i>
                <span class="rk-val">${vf(r.value)}${unit ? ' ' + unit : ''}</span>
                <i class="rk-gap" style="flex:${rest.toFixed(4)} 1 0"></i>
            </span>
            <span class="chart-tip">
                <!-- 三行顺次：时间（口径日期）→ 设备名称 → 数值（带单位，不带指标名） -->
                <span class="t-s">${periodLabel()}</span>
                <span class="t-v" title="${r.name}">${shortDevName(r.name)}</span>
                <span class="t-v">${vf(r.value)}${unit ? ' ' + unit : ''}</span>
            </span>
        </div>`;
    }).join('')}</div>`;
}

/* 机群柱状图（竖向）：X 轴＝设备名称、Y 轴＝指标数值；柱子一根不少、不聚合、不滚动、不按段重复
   （对齐《折线图节点密度示例》：一律单张出图，靠刻度倾斜 / 抽稀解决密集）
   柱顶数值：节点 ≤12 且柱宽够（≥18px）才标，否则一律不标，避免相邻数值压叠 */
function vRankChartHTML(rows, unit, vf, metric, axisUnit) {
    const n = rows.length || 1;
    const max = Math.max.apply(null, rows.map(r => r.value).concat([0])) || 1;
    /* 同折线图：按标签宽度判定是否倾斜（设备名称是中文，6~7 个字 → 基本都会倾斜） */
    const band = 330 / n;
    const names = rows.map(r => shortDevName(r.name));          /* 刻度用缩略名，气泡里仍是全名 */
    const dense = Math.max.apply(null, names.map(labelWidth)) + 4 > band;
    const step = labelStep(n, dense);
    /* 柱顶数值：一律带上单位（如 13.3 h）。
       列宽够 → 同一行；只够一半 → 相邻柱错开一行（横距翻倍，仍不压叠）；再密才不标（规范：避免压叠） */
    const valW = Math.max.apply(null, rows.map(r => labelWidth(vf(r.value) + (unit ? ' ' + unit : ''))));
    const pitch = 330 / n;
    const stagger = pitch < valW + 6;
    const showVal = pitch + (stagger ? pitch : 0) >= valW + 6;
    const ticks = [];
    for (let i = 6; i >= 0; i--) ticks.push(max * i / 6);
    const grid = ticks.map((t, i) =>
        `<i class="${i === 0 ? 'top' : ''}" style="top:${(i / 6 * 100).toFixed(2)}%"></i>`).join('');
    const cols = `grid-template-columns:repeat(${n},minmax(0,1fr))`;
    /* 柱子列与标签列必须同一套「列宽 + 间距 + 内边距」，否则两端标签会相对柱子错位 */
    const gap = dense ? 6 : 10;
    const bars = rows.map((r, i) => {
        const edge = i === 0 ? ' edge-l' : (i === n - 1 ? ' edge-r' : '');
        return `<div class="chart-col tp${edge}" onclick="toggleBarTip(event, this)">
            <div class="chart-bar" style="height:${(r.value / max * 100).toFixed(2)}%">
                ${showVal && r.value ? `<span class="chart-val${stagger && i % 2 ? ' stag' : ''}">${vf(r.value)}${unit ? ' ' + unit : ''}</span>` : ''}
            </div>
            <span class="chart-tip">
                <!-- 三行顺次：时间（口径日期）→ 设备名称 → 数值（带单位，不带指标名） -->
                <span class="t-s">${periodLabel()}</span>
                <span class="t-v" title="${r.name}">${shortDevName(r.name)}</span>
                <span class="t-v">${vf(r.value)}${unit ? ' ' + unit : ''}</span>
            </span>
        </div>`;
    }).join('');
    const xs = rows.map((r, i) => {
        if (step > 1 && (n - 1 - i) % step !== 0) return '<span></span>';
        return `<span${dense ? ' class="tilt"' : ''} title="${r.name}">${names[i]}</span>`;
    }).join('');
    const plotH = dense ? 250 : 220;
    const bottom = dense ? 70 : 48;
    return `<div class="chart-wrap">
        ${(axisUnit || unit) ? `<span class="chart-unit">${axisUnit || unit}</span>` : ''}
        <div class="chart-y" style="padding-bottom:${bottom}px">${ticks.map(t => `<span>${vf(t)}</span>`).join('')}</div>
        <div class="chart-plot" style="height:${plotH}px">
            <div class="chart-area" style="bottom:${bottom}px">
                <div class="chart-grid">${grid}</div>
                <div class="chart-bars" style="${cols};gap:${gap}px;padding:0 8px">${bars}</div>
            </div>
            <div class="chart-x" style="${cols};height:${bottom}px;gap:${gap}px;padding:0 8px">${xs}</div>
        </div>
    </div>`;
}

/* 环形占比图（机群＝单机贡献度）：只 1 个累计型指标；最多 6 块 —— 前 5 台 + 「其他」；
   扇区取规范配色（品牌 5 色 + 中性灰）；中心显示总计数值与单位 */
const RING_COLORS = ['#E60012', '#F59E0B', '#0F766E', '#2563EB', '#7C3AED'];
const RING_OTHER = '#94A3B8';

let ringTipData = [];                 /* 环形图当前各扇区（含「其他」）的名称 / 数值文案 */

/* 悬停扇区或图例 → 顶部气泡（点一下就钉住，再点空白收起，手机端也能看） */
function showRingTip(i) {
    const box = document.querySelector('#screen .ring-wrap');
    const tip = document.getElementById('ringTip');
    const d = ringTipData[i];
    if (!box || !tip || !d) return;
    tip.innerHTML = '<span class="t-s">' + d.name + '</span><span class="t-v">' + d.text + '</span>';
    box.classList.add('tip-on');
}
function hideRingTip() {
    const box = document.querySelector('#screen .ring-wrap');
    if (box) box.classList.remove('tip-on');
}

function ringChartHTML(items, unit) {
    /* 只留前 5 台，其余聚合成「其他」 */
    const top = items.slice(0, 5).map((it, i) => Object.assign({}, it, { color: RING_COLORS[i] }));
    const rest = items.slice(5);
    if (rest.length) {
        top.push({
            name: '其他（' + rest.length + ' 台）',
            value: rest.reduce((s, it) => s + it.value, 0),
            color: RING_OTHER
        });
    }
    const total = top.reduce((s, it) => s + it.value, 0) || 1;
    /* 气泡数据（悬停扇区 / 图例时由 showRingTip(i) 取用） */
    ringTipData = top.map(it => ({
        name: it.name,                       /* 与图例一致的缩略名（全名在 title 属性里） */
        text: fmt(it.value, 1) + (unit ? ' ' + unit : '') + ' · ' + (it.value / total * 100).toFixed(1) + '%'
    }));
    let cum = 0;
    const arcs = top.map((it, i) => {
        const pct = it.value / total * 100;
        const seg = `<circle class="ring-arc" cx="21" cy="21" r="15.9155" fill="none" stroke="${it.color}" stroke-width="6"`
            + ` stroke-dasharray="${pct.toFixed(3)} ${(100 - pct).toFixed(3)}"`
            + ` stroke-dashoffset="${(-cum).toFixed(3)}"`
            + ` onmouseenter="showRingTip(${i})" onmouseleave="hideRingTip()"/>`;
        cum += pct;
        return seg;
    }).join('');
    const legend = top.map((it, i) =>
        `<div class="ring-item" onmouseenter="showRingTip(${i})" onmouseleave="hideRingTip()">
            <i style="background:${it.color}"></i>
            <span class="ri-name" title="${it.full || it.name}">${it.name}</span>
            <span class="ri-val">${fmt(it.value, 1)}${unit ? ' ' + unit : ''} · ${(it.value / total * 100).toFixed(1)}%</span>
        </div>`).join('');
    return `<div class="ring-wrap">
        <span class="chart-tip" id="ringTip"></span>
        <div class="ring">
            <svg viewBox="0 0 42 42"><g transform="rotate(-90 21 21)">${arcs}</g></svg>
            <div class="ring-center"><b>${fmt(total, 1)}</b><span>${unit || ''}</span></div>
        </div>
        <div class="ring-legend">${legend}</div>
    </div>`;
}

/* 工时排行榜数据：每台已选设备 = 当前所选周期的合计（机群柱状图不做时间维度 → 时间塌缩）；
   降序；数值相同时按设备编号升序 */
function hourRanking() {
    return selIds().map(id => {
        const m = MACHINES.filter(x => x.id === id)[0] || {};
        return {
            id: id,
            name: m.name || id,
            value: aggregate([id], 'totalWork', state.period, state.endIndex) || 0
        };
    }).sort((a, b) => (b.value - a.value) || (a.id < b.id ? -1 : 1));
}

/* ==================== 图表 ⇄ 明细：切换与 xlsx 观感表格 ====================
   后端口径与 PC 端一致，PC 端是「图表 + xlsx 表格」两套呈现；手机端在每张图表卡片右上角
   放一枚「图表 / 明细」开关，切到明细就用同一份数据渲染 xlsx 观感的明细表。
   明细表复用页面已有的 .list-* 结构 → 自动获得横向拖动、首列冻结、合计行。 */
function setChartView(key, view) {
    state.chartView[key] = view;
    render();
}
function isChartTable(key) { return state.chartView[key] === 'table'; }
function viewToggleHTML(key) {
    const t = isChartTable(key);
    return '<span class="view-toggle">'
        + '<button type="button" class="view-tab' + (t ? '' : ' active')
        + '" onclick="setChartView(\'' + key + '\',\'chart\')">图表</button>'
        + '<button type="button" class="view-tab' + (t ? ' active' : '')
        + '" onclick="setChartView(\'' + key + '\',\'table\')">明细</button>'
        + '</span>';
}
/* gridCols：CSS 列宽串；head：表头（第 1 列是行首列标题）；rows：行数据；foot：合计行；note：表下小注 */
const XLS_PAGE_SIZE = 5;           /* 图表明细表每页行数（10 行 → 2 页，便于看分页效果） */
/* 机群页只有「数据台账」这一张设备列表（周期明细在单机页），故不共用单机页的 LIST_PAGE_SIZE */
const LEDGER_PAGE_SIZE = 10;       /* 数据台账每页行数（默认 10 条：整批设备一屏摊开，超出才出分页） */
/* 通用分页条：key＝state.xlsPage 里的键，fn 固定 xlsPageGo；只有多于一页时才渲染 */
function pagerHTML(key, page, pages, from, size, total) {
    if (pages <= 1) return '';
    const btn = (label, n, on, dis) => '<button type="button" class="pg-btn' + (on ? ' on' : '') + '"'
        + (dis ? ' disabled' : '') + ' onclick="xlsPageGo(\'' + key + '\',' + n + ')">' + label + '</button>';
    /* 页码窗口：首末页 + 当前页 ±1，其余用省略号 —— 100 台设备也只出 5 个数字，不会把卡片挤爆 */
    const nums = [1, pages];
    for (let n = page - 1; n <= page + 1; n++) if (n >= 1 && n <= pages) nums.push(n);
    const uniq = nums.filter((n, i) => nums.indexOf(n) === i).sort((a, b) => a - b);
    const win = uniq.map((n, i) => (i && n - uniq[i - 1] > 1 ? '<span class="pg-gap">…</span>' : '')
        + btn(n, n, n === page, false));
    return '<div class="xls-pager">'
        + '<span class="xls-range">' + (from + 1) + '-' + Math.min(from + size, total)
        + ' / 共 ' + total + ' 条</span>'
        + '<span class="xls-pages">' + btn('&#8249;', page - 1, false, page === 1)
        + win.join('') + btn('&#8250;', page + 1, false, page === pages)
        + '</span></div>';
}
function xlsPageGo(key, page) {
    state.xlsPage[key] = page;
    render();
}
/* 排序图标（图表明细表 / 数据台账共用）：col＝当前排序列、dir＝当前方向，未排序的箭头置灰 */
function sortIco(key, j) {
    const s = state.chartSort[key] || {};
    const col = typeof s.col === 'number' ? s.col : -1;
    const dir = s.dir === 'desc' ? 'desc' : 'asc';
    return '<svg class="sort-ico' + (col === j ? ' on' : '') + '" width="8" height="12"'
        + ' viewBox="0 0 8 12" fill="currentColor" aria-hidden="true">'
        + '<path d="M4 .6 7.3 4.5H.7z"' + (col === j && dir === 'asc' ? '' : ' opacity=".45"') + '/>'
        + '<path d="M4 11.4.7 7.5h6.6z"' + (col === j && dir === 'desc' ? '' : ' opacity=".45"') + '/></svg>';
}
function sortXls(key, i) {
    const cur = state.chartSort[key] || {};
    state.chartSort[key] = { col: i, dir: (cur.col === i && cur.dir === 'asc') ? 'desc' : 'asc' };
    state.xlsPage[key] = 1;        /* 重排后回到第 1 页 */
    render();
}
function xlsTableHTML(key, gridCols, head, rows, foot) {
    const grid = 'grid-template-columns:' + gridCols + ';';
    /* 明细表只做呈现：表头不可点（不带排序 / 排行筛选），行序 = 调用方传入的顺序
       —— 排行榜类卡片传入的就是「按第 1 指标降序」，明细与图表口径一致 */
    const cell = (c, j) => '<span' + (j ? ' class="num"' : '') + '>' + c + '</span>';
    /* 分页：每页 XLS_PAGE_SIZE 行，页码存在 state.xlsPage[key]；合计行固定在最后、不参与分页 */
    const size = XLS_PAGE_SIZE;
    const pages = Math.max(1, Math.ceil(rows.length / size));
    const page = Math.min(Math.max(1, state.xlsPage[key] || 1), pages);
    const from = (page - 1) * size;
    const view = rows.slice(from, from + size);
    const pager = pagerHTML(key, page, pages, from, size, rows.length);
    return '<div class="list-block xls">'
        + '<div class="list-scroll">'
        + '<div class="list-head" style="' + grid + '">' + head.map(cell).join('') + '</div>'
        + view.map(r => '<div class="list-row" style="' + grid + '">' + r.map(cell).join('') + '</div>').join('')
        + (foot ? '<div class="list-total" style="' + grid + '">' + foot.map(cell).join('') + '</div>' : '')
        + '</div>'
        + pager
        + '</div>';
}

function render() {
    syncNodes();
    const ids = selIds();
    const curM = MACHINES.filter(m => m.id === ids[0])[0] || MACHINES[0];
    /* 标题回显（点右侧 ▼ 打开选择器）：
       ① 所选设备刚好 = 某个分组 → 显示「分组 xx」
       ② 1 台 → 设备型号；多台 → 「N 台设备」（设备编号按要求不展示） */
    const hitGroup = deviceGroups.filter(g => sameIds(g.machines, ids))[0];
    document.getElementById('pageTitle').textContent = hitGroup
        ? '分组 ' + hitGroup.name
        : (ids.length > 1 ? ids.length + ' 台设备' : curM.model);
    document.getElementById('devAvatar').innerHTML = devAvatar(curM.type);
    document.getElementById('dateMain').innerHTML = periodLabel() + '<span class="caret">▼</span>';
    document.getElementById('navNext').disabled = state.endIndex >= DAYS - 1;

    document.querySelectorAll('.period-tab').forEach(t => t.classList.toggle('active', t.dataset.period === state.period));

    const screen = document.getElementById('screen');

    /* 网络异常态：内容区显示缺省页，文案引导「下拉重新刷新」
       （下拉刷新时必然先异常一次，见 bindPullToRefresh 里的 netNext 逻辑） */
    if (state.pageState === 'netError') {
        screen.innerHTML = `
            <div class="empty-wrap">
                <svg width="120" height="104" viewBox="0 0 120 104" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="60" cy="52" r="34" fill="#f2f4f7"/>
                    <path d="M44 45c4-5 10-8 16-8s12 3 16 8" stroke="#c8ccd4" stroke-width="3" stroke-linecap="round"/>
                    <path d="M50 56c3-3 6-4 10-4s7 1 10 4" stroke="#c8ccd4" stroke-width="3" stroke-linecap="round"/>
                    <circle cx="60" cy="68" r="3.4" fill="#c8ccd4"/>
                    <path d="M40 72L80 32" stroke="#E60012" stroke-width="3.4" stroke-linecap="round" opacity=".85"/>
                </svg>
                <div class="empty-title">网络异常，报表加载失败</div>
                <div class="empty-sub">请检查网络环境后再尝试操作</div>
            </div>`;
        return;
    }

    const idxs = periodIdxs();
    const html = [];

    /* 1. 指标卡（两列：发动机运行时长 / 燃油消耗）—— 机群口径：已选设备逐日相加 */
    const runHours = idxs.reduce((s, i) => s + (hoursOf(i) || 0), 0);
    const fuelTotal = idxs.reduce((s, i) => s + (fuelOf(i) || 0), 0);
    html.push(`<div class="kpi-strip">
        <div class="kpi"><div class="kpi-value">${hm(runHours)}<small>h</small></div><div class="kpi-label">发动机运行时长</div></div>
        <div class="kpi"><div class="kpi-value">${fmt(fuelTotal, 1)}<small>L</small></div><div class="kpi-label">燃油消耗</div></div>
    </div>`);

    /* 2. 工时排行（机群柱状图·横向条形＝设备排行榜：按工时降序、全量不截断、条端标数值；
       机群柱状图不做时间维度 → 每台取「当前所选周期」的合计） */
    const cols = PERIOD_VIEW[state.period].listCols;
    const colCell = (c, v) => FIELDS[c].unit === '小时' ? hm(v) : fmt(v, 1);
    const ranking = hourRanking();                       /* 全量，已按工时降序 */
    const rankTop = ranking.slice(0, CHART_TOP_N);        /* 图表默认只画前 10 台 */
    const rankSum = ranking.reduce((a, r) => a + r.value, 0);
    html.push(`<div class="card">
        <div class="card-title">工时排行（横向）${viewToggleHTML('rankH')}</div>
        ${isChartTable('rankH')
            ? xlsTableHTML('rankH', 'minmax(96px,1fr) minmax(104px,.9fr)', ['设备', '总工时（h）'],
                ranking.map(r => [r.name, hm(r.value)]), ['合计', hm(rankSum)])
            : rankChartHTML(rankTop, 'h', h1, '总工时')}
    </div>`);

    /* 3. 工时排行（机群柱状图·竖向：X＝设备名称、Y＝数值；与横向同一份数据、两种排布） */
    html.push(`<div class="card">
        <div class="card-title">工时排行（竖向）${viewToggleHTML('rankV')}</div>
        ${isChartTable('rankV')
            ? xlsTableHTML('rankV', 'minmax(96px,1fr) minmax(104px,.9fr)', ['设备', '总工时（h）'],
                ranking.map(r => [r.name, hm(r.value)]), ['合计', hm(rankSum)])
            : vRankChartHTML(rankTop, 'h', h1, '总工时', '总工时（h）')}
    </div>`);

    /* 3. 能耗分析（机群折线图：一台设备一条线，共用一个 Y 轴刻度，不做离群特殊处理；
       X 轴口径＝日 7 / 周 8 / 月 12） */
    const ranges = chartRanges();
    const lines = deviceLines(['G', 'H']);               /* 只取能耗最高的前 10 台 */
    const enHead = ['周期'].concat(lines.map(d => shortDevName(d.name)), ['合计']);
    const enRows = ranges.map((r, i) => [r.label]
        .concat(lines.map(d => fmt(d.values[i], 1)))
        .concat([fmt(lines.reduce((a, d) => a + (d.values[i] || 0), 0), 1)]));
    const enFoot = ['合计'].concat(lines.map(d => fmt(d.total, 1)), [fmt(lines.reduce((a, d) => a + d.total, 0), 1)]);
    const enGrid = 'minmax(84px,1fr) repeat(' + lines.length + ', minmax(108px,.95fr)) minmax(84px,.9fr)';
    html.push(`<div class="card">
        <div class="card-title">能耗分析${viewToggleHTML('energy')}</div>
        ${isChartTable('energy')
            ? xlsTableHTML('energy', enGrid, enHead, enRows, enFoot)
            : multiLineChartHTML(ranges.map(r => r.label), lines, 'L', function (v) { return fmt(v, 1); }, '能耗（L）')}
    </div>`);

    /* 4. 总油耗（机群环形图：单指标累计量，前 5 台 + 「其他」，中心＝机群总计） */
    const contrib = selIds().map(id => {
        const m = MACHINES.filter(x => x.id === id)[0] || {};
        /* 设备名在这里就缩略：环形图例是窄位，但汇总结论项「其他（N 台）」不受影响；
           full 保留全名，供气泡使用 */
        return { name: shortDevName(m.name || id), full: m.name || id,
                 value: aggregate([id], 'totalFuelGH', state.period, state.endIndex) || 0 };
    }).sort((a, b) => b.value - a.value);
    const fuelSum = contrib.reduce((a, c) => a + c.value, 0);
    const fuelPct = v => (fuelSum ? (v / fuelSum * 100).toFixed(1) : '0.0') + '%';
    html.push(`<div class="card">
        <div class="card-title">总油耗${viewToggleHTML('fuel')}</div>
        ${isChartTable('fuel')
            ? xlsTableHTML('fuel', 'minmax(96px,1fr) minmax(96px,.9fr) minmax(72px,.6fr)',
                ['设备', '油耗（L）', '占比'],
                contrib.map(c => [c.full, fmt(c.value, 1), fuelPct(c.value)]),
                ['合计', fmt(fuelSum, 1), '100.0%'])
            : ringChartHTML(contrib, colUnit('totalFuelGH') || FIELDS.totalFuelGH.unit)}
    </div>`);

    /* 5. 数据台账（机群明细表：行＝设备、列＝核心指标，行数恒等于设备数；
       单元格 = 该设备在「当前所选周期」内的 SUM）
       · 表头索引：0＝排行、1＝设备编号、2＝设备名称、之后＝指标列（与 cols 一一对应）；
         设备编号按「前 4 … 后 4」缩略显示（完整编号在 title 里）
       · 指标表头可点排序（复用 state.chartSort.ledger / sortXls），默认按总工时降序
         —— 与上方「工时排行」图表同一口径；排行列随当前排序 1..N 重编号，跨页连续 */
    const LED_METRIC_FROM = 2;
    /* 首次进入默认按「总工时」降序（与上方工时排行同一口径）；状态写回 chartSort → 表头箭头能高亮 */
    if (!state.chartSort.ledger) state.chartSort.ledger = { col: LED_METRIC_FROM, dir: 'desc' };
    const ledSort = state.chartSort.ledger;
    const ledRows = selIds()
        .map(id => MACHINES.filter(x => x.id === id)[0] || { id: id, name: id })
        .map(m => ({ m: m, vals: cols.map(c => aggregate([m.id], c, state.period, state.endIndex)) }));
    const ledMi = (typeof ledSort.col === 'number' ? ledSort.col : LED_METRIC_FROM) - LED_METRIC_FROM;
    const ledDir = ledSort.dir === 'asc' ? 1 : -1;
    if (ledMi >= 0 && ledMi < cols.length) {
        ledRows.sort((a, b) => {
            const x = a.vals[ledMi], y = b.vals[ledMi];
            if (x === null && y === null) return 0;
            if (x === null) return 1;              /* 该周期取不到值 → 恒排最后 */
            if (y === null) return -1;
            return (x - y) * ledDir;
        });
    }
    /* 分页：设备可能上百台，每页 LEDGER_PAGE_SIZE（默认 10）行；合计行仍按全部设备汇总 */
    const lPages = Math.max(1, Math.ceil(ledRows.length / LEDGER_PAGE_SIZE));
    const lPage = Math.min(Math.max(1, state.xlsPage.ledger || 1), lPages);
    state.xlsPage.ledger = lPage;
    const lFrom = (lPage - 1) * LEDGER_PAGE_SIZE;
    const ledView = ledRows.slice(lFrom, lFrom + LEDGER_PAGE_SIZE);
    /* 排行列定宽 56px；设备列之后是指标列 */
    const ledGrid = `grid-template-columns: 56px minmax(92px, .8fr) minmax(96px, 1fr) repeat(${cols.length}, minmax(104px, .9fr));`;
    const ledTotals = cols.map(c => aggregate(selIds(), c, state.period, state.endIndex));
    html.push(`<div class="card">
        <div class="card-title">数据台账</div>
        <div class="list-block">
            <div class="list-scroll led">
                <div class="list-head" style="${ledGrid}">
                    <span>排行</span>
                    <span>设备编号</span>
                    <span>设备名称</span>
                    ${cols.map((c, i) => `<span class="num" data-sort="${i + LED_METRIC_FROM}" onclick="sortXls('ledger',${i + LED_METRIC_FROM})" title="点击排序">${LIST_LABEL[c] || FIELDS[c].label.replace(/（[A-H]）|\[.*?\]/g, '')}${colUnit(c) ? '(' + colUnit(c) + ')' : ''}${sortIco('ledger', i + LED_METRIC_FROM)}</span>`).join('')}
                </div>
                ${ledView.map((r, i) => `<div class="list-row" style="${ledGrid}">
                    <span>${lFrom + i + 1}</span>
                    <span class="dev-no" title="${r.m.no || r.m.id}">${devNoShort(r.m.no || r.m.id)}</span>
                    <span title="${r.m.name}">${shortDevName(r.m.name)}</span>
                    ${r.vals.map((v, j) => `<span class="num">${colCell(cols[j], v)}</span>`).join('')}
                </div>`).join('')}
                <div class="list-total" style="${ledGrid}">
                    <span></span>
                    <span></span>
                    <span>合计</span>
                    ${ledTotals.map((t, i) => `<span class="num">${t === null ? '—' : colCell(cols[i], t)}</span>`).join('')}
                </div>
            </div>
            ${pagerHTML('ledger', lPage, lPages, lFrom, LEDGER_PAGE_SIZE, ledRows.length)}
        </div>
    </div>`);

    screen.innerHTML = html.join('');
    bindTableDrag();
}

/* 点柱子 / 数据点：钉住气泡（移动端没有 hover）；点空白处收起
   —— 与单机版同一套交互 */
function toggleBarTip(ev, el) {
    if (ev) ev.stopPropagation();
    const on = el.classList.contains('tip-on');
    document.querySelectorAll('.tp.tip-on').forEach(x => x.classList.remove('tip-on'));
    if (!on) el.classList.add('tip-on');
}
document.addEventListener('click', function () {
    document.querySelectorAll('.tp.tip-on').forEach(x => x.classList.remove('tip-on'));
});

/* 明细表整表横向拖动（鼠标；触摸端走原生滑动） */
function bindTableDrag() {
    /* 页面上可能有多张表（后续再加表也不会漏绑）→ 每张各自绑定 */
    document.querySelectorAll('#screen .list-scroll').forEach(function (box) {
        bindOneTableDrag(box);
    });
}

function bindOneTableDrag(box) {
    if (!box || box.dataset.dragBound === '1') return;
    box.dataset.dragBound = '1';
    let dragging = false, startX = 0, startLeft = 0;
    box.addEventListener('mousedown', e => {
        if (box.scrollWidth <= box.clientWidth) return;    /* 不需要滚动就不接管 */
        e.preventDefault();
        dragging = true; startX = e.clientX; startLeft = box.scrollLeft;
        box.classList.add('dragging');
    });
    box.addEventListener('mousemove', e => {
        if (!dragging) return;
        box.scrollLeft = startLeft - (e.clientX - startX);
    });
    const end = () => { if (!dragging) return; dragging = false; box.classList.remove('dragging'); };
    box.addEventListener('mouseup', end);
    box.addEventListener('mouseleave', end);
}

/* ==================== 交互 ==================== */
function switchPeriod(p) { state.period = p; state.endIndex = DAYS - 1; render(); }

function shiftDate(delta) {
    const span = Math.max(0, state.endIndex - state.startIndex);
    if (state.period === 'month') {
        /* 月报：跳到「上一个月 / 下一个月」的最后一天 */
        const d = dateOf(state.endIndex);
        const last = new Date(d.getFullYear(), d.getMonth() + delta + 1, 0);
        state.endIndex = Math.min(DAYS - 1, Math.max(0, idxOfDate(last)));
    } else {
        const step = state.period === 'day' ? 1 : 7;
        state.endIndex = Math.min(DAYS - 1, Math.max(0, state.endIndex + delta * step));
    }
    state.startIndex = Math.max(0, state.endIndex - span);
    render();
}

/* ==================== 设备选择弹层（机群报表：可多选设备） ====================
   · 左栏 = 各设备类型（只筛列表，不限制选择）
   · 点行 = 勾选 / 取消该设备（多选）；点分组 = 一键选中该组设备
   · 工具条：全选本类（当前类型下全部，可跨类型累加）/ 清空；底部：重置（放弃改动）/ 保存（应用） */
const BOX_CHECK = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"'
    + ' stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';

let pickerType = DEVICE_TYPES[0].type;      /* 左栏当前类型（默认第 1 种） */
let pickerSel = [];                         /* 弹层内待保存的设备 id */

/* 打开弹层：默认第 1 种类型 + 回显当前报表已选设备 */
function openMachinePicker() {
    pickerType = DEVICE_TYPES[0].type;
    pickerSel = selIds().slice();
    deviceGroups = loadDeviceGroups();     /* 每次打开重读：「添加分组」页新建后回来即时可见 */
    renderMachinePicker();
    document.getElementById('machinePicker').classList.add('show');
    document.body.style.overflow = 'hidden';
}

function closeMachinePicker() {
    document.getElementById('machinePicker').classList.remove('show');
    document.body.style.overflow = '';
}

/* 当前类型下的设备清单 */
function pickerPool() {
    const g = DEVICE_TYPES.filter(t => t.type === pickerType)[0];
    return g ? g.models.map(m => Object.assign({ type: g.type }, m)) : [];
}

function selectPickerType(type) {
    pickerType = type;
    renderMachinePicker();
}

function renderMachinePicker() {
    const typesEl = document.getElementById('pickerTypes');
    const modelsEl = document.getElementById('pickerModels');
    if (!typesEl || !modelsEl) return;

    const pickedIn = ids => ids.filter(id => pickerSel.indexOf(id) >= 0).length;

    /* 左栏：各设备类型（括号里显示 已选/总数，方便看「本类选了没」） */
    typesEl.innerHTML = DEVICE_TYPES.map(t => {
        const total = t.models.length;
        const on = pickedIn(t.models.map(m => m.id));
        return '<div class="picker-type' + (t.type === pickerType ? ' active' : '') + '"'
            + ' onclick="selectPickerType(&quot;' + t.type + '&quot;)">' + t.type
            + '<span class="pt-count">（' + (on ? on + '/' + total : total) + '）</span></div>';
    }).join('');

    /* 右栏：设备多选（点击整行切换勾选，不再关弹层） */
    const list = pickerPool();
    modelsEl.innerHTML = list.length ? list.map(m =>
        '<div class="picker-model' + (pickerSel.indexOf(m.id) >= 0 ? ' selected' : '') + '"'
        + ' onclick="togglePick(&quot;' + m.id + '&quot;)">'
        + '<div class="pm-main"><div class="pm-name">' + m.no + '</div>'
        + '<div class="pm-sub">' + m.name + '</div></div>'
        + '<span class="pm-box">' + BOX_CHECK + '</span></div>'
    ).join('') : '<div class="picker-empty">该类型下暂无设备</div>';

    renderPickerGroups();
    paintPickerFoot();
}

/* 分组快捷条（横向可滚）：点一下 = 选中该分组设备，再点一下取消；与当前选择一致时高亮 */
function renderPickerGroups() {
    const box = document.getElementById('pickerGroups');
    if (!box) return;
    box.innerHTML = deviceGroups.map(g =>
        '<button class="pg-chip' + (sameIds(g.machines, pickerSel) ? ' active' : '') + '"'
        + ' data-group="' + escAttr(g.name) + '" onclick="pickGroup(this.dataset.group)">'
        + escAttr(g.name)
        + '<span class="pg-more" data-group="' + escAttr(g.name) + '" title="编辑 / 删除分组"'
        + ' onclick="event.stopPropagation(); openGroupMenu(this.dataset.group)">'
        + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"'
        + ' stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4l10-10-4-4L4 16v4Z"/>'
        + '<path d="M13.5 6.5l4 4"/></svg></span>'
        + '</button>'
    ).join('') + '<button class="pg-chip pg-add" onclick="goAddGroup()">＋ 添加分组</button>';
}

/* 两个 id 集合是否完全一致（顺序无关） */
function sameIds(a, b) {
    const A = a || [], B = b || [];
    return A.length === B.length && A.every(id => B.indexOf(id) >= 0);
}

function pickGroup(name) {
    const g = deviceGroups.filter(x => x.name === name)[0];
    if (!g) return;
    pickerSel = sameIds(g.machines, pickerSel) ? [] : g.machines.slice();
    renderMachinePicker();
}

function togglePick(id) {
    const i = pickerSel.indexOf(id);
    if (i >= 0) pickerSel.splice(i, 1); else pickerSel.push(id);
    renderMachinePicker();
}

/* 全选本类：当前类型下的全部设备（切类型再点会累加） */
function pickAll() {
    pickerPool().forEach(m => { if (pickerSel.indexOf(m.id) < 0) pickerSel.push(m.id); });
    renderMachinePicker();
}

function pickClear() {
    pickerSel = [];
    renderMachinePicker();
}

function paintPickerFoot() {
    const el = document.getElementById('pickerCount');
    if (el) el.innerHTML = '已选 <b>' + pickerSel.length + '</b> / ' + MACHINES.length + ' 台';
}

/* 重置 = 放弃本次改动，回到报表当前已应用的设备 */
function resetMachinePicker() {
    pickerSel = selIds().slice();
    renderMachinePicker();
}

/* 保存 = 应用多选结果：KPI / 图表 / 数据台账 / 分享图 全部按这批设备汇总 */
function saveMachinePicker() {
    if (!pickerSel.length) { showToast('请至少选择 1 台设备'); return; }
    const n = pickerSel.length;
    const one = MACHINES.filter(m => m.id === pickerSel[0])[0] || {};
    applyMachineSelection(pickerSel.slice());
    closeMachinePicker();
    showToast(n > 1 ? '已切换为机群报表：' + n + ' 台设备' : '当前设备：' + one.name);
}

/* 应用设备选择 → 写入状态并重渲染（顶部标签在 render 内同步） */
function applyMachineSelection(ids) {
    state.machineIds = ids.slice();
    state.machineId = ids[0];
    render();
}

/* ==================== 设备分组数据（供弹层快捷条用） ====================
   来源：「添加分组」页写入的本地配置（mysany_device_groups）+ 内置演示分组
   两者合并（同名以本地配置为准）—— 新建分组后，演示分组不会“凭空消失” */
const GROUP_STORE_KEY = 'mysany_device_groups';
const GROUP_HIDE_KEY = 'mysany_device_groups_hidden';   /* 被删掉的演示分组名：避免删完又被合并回来 */
const DEFAULT_GROUPS = [
    /* 三组示例覆盖两种常见建组思路：按班组（土方组，跨机型）、按机型（挖机组，同类设备）
       —— 每组 ≤ 10 台，与「机群单次最多 10 台」对齐；点分组条即可一键选中
       名字控制在 3 字：分组条是横向可滚的，太长会把「＋ 添加分组」挤出屏幕 */
    { name: '土方组', machines: ['EX001', 'EX002', 'LD001', 'LD002', 'WT001', 'WT002'] },
    { name: '挖机组', machines: ['EX001', 'EX002', 'EX003', 'EX004', 'EX005', 'EX006'] },
    { name: '吊装组', machines: ['CR001', 'CR002', 'CR003', 'CR004', 'CR005'] }
];

function hiddenGroups() {
    try {
        const arr = JSON.parse(localStorage.getItem(GROUP_HIDE_KEY) || 'null');
        return Array.isArray(arr) ? arr.map(String) : [];
    } catch (e) { return []; }
}

let deviceGroups = loadDeviceGroups();

function loadDeviceGroups() {
    let stored = [];
    try {
        const arr = JSON.parse(localStorage.getItem(GROUP_STORE_KEY) || 'null');
        if (Array.isArray(arr)) {
            stored = arr.filter(o => o && o.name).map(o => ({ name: String(o.name), machines: o.machines || [] }));
        }
    } catch (e) { /* 配置损坏 → 只用内置演示分组 */ }
    const names = stored.map(o => o.name);
    const hide = hiddenGroups();
    return DEFAULT_GROUPS.filter(o => names.indexOf(o.name) < 0 && hide.indexOf(o.name) < 0)
        .map(o => ({ name: o.name, machines: o.machines.slice() }))
        .concat(stored);
}

/* 组名来自用户输入 → 渲染前统一转义 */
function escAttr(v) {
    return String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

/* 添加分组 → 独立页面（保存后写回 localStorage，返回本页打开弹层即可见） */
function goAddGroup() {
    closeMachinePicker();
    location.href = '添加分组.html';
}

/* ==================== 分组快捷条：长按（桌面右键）→ 编辑 / 删除 ====================
   点一下 = 一键选中该组设备（原有行为）；长按 500ms 或桌面右键 = 弹出操作菜单 */
let groupMenuName = '';
let groupPressTimer = null;
let groupPressFired = false;

function bindGroupPress() {
    const box = document.getElementById('pickerGroups');
    if (!box || box.dataset.pressBound === '1') return;
    box.dataset.pressBound = '1';
    const chipOf = e => (e.target && e.target.closest ? e.target.closest('.pg-chip[data-group]') : null);

    const start = e => {
        const chip = chipOf(e);
        if (!chip) return;
        groupPressFired = false;
        clearTimeout(groupPressTimer);
        groupPressTimer = setTimeout(() => {
            groupPressFired = true;
            openGroupMenu(chip.dataset.group);
        }, 500);
    };
    const stop = () => clearTimeout(groupPressTimer);

    box.addEventListener('touchstart', start, { passive: true });
    box.addEventListener('touchend', stop);
    box.addEventListener('touchmove', stop);
    box.addEventListener('mousedown', start);
    box.addEventListener('mouseup', stop);
    box.addEventListener('mouseleave', stop);
    /* 长按已经弹了菜单 → 吃掉随后那次 click，别再触发「选中该组」 */
    box.addEventListener('click', e => {
        if (!groupPressFired) return;
        groupPressFired = false;
        e.stopPropagation();
        e.preventDefault();
    }, true);
    /* 桌面端：右键 = 同一个菜单 */
    box.addEventListener('contextmenu', e => {
        const chip = chipOf(e);
        if (!chip) return;
        e.preventDefault();
        openGroupMenu(chip.dataset.group);
    });
}

/* ==================== 日期选择：滚轮（年 / 月 / 周期区间） ==================== */
const WHEEL_H = 44;                     /* 单行高度，与 CSS .wheel-item 一致 */
const dateCols = { years: [], months: [], thirds: [], y: 0, m: 0, t: 0 };

function pad2(n) { return String(n).padStart(2, '0'); }
function fmtMD(d) { return pad2(d.getMonth() + 1) + '/' + pad2(d.getDate()); }

/* 数据窗口内所有日期 */
function windowDates() {
    return Array.from({ length: DAYS }, (_, i) => ({ idx: i, d: dateOf(i) }));
}

/* 组装三列：年 / 月 / 第三列（日报=日、周报=周区间、月报=无） */
function buildDateCols(y, m) {
    const all = windowDates();
    const years = [...new Set(all.map(o => o.d.getFullYear()))];
    if (years.indexOf(y) < 0) y = years[years.length - 1];
    const months = [...new Set(all.filter(o => o.d.getFullYear() === y).map(o => o.d.getMonth() + 1))];
    if (months.indexOf(m) < 0) m = months[months.length - 1];
    const inMonth = all.filter(o => o.d.getFullYear() === y && o.d.getMonth() + 1 === m);

    let thirds = [];
    if (state.period === 'day') {
        thirds = inMonth.map(o => ({ label: pad2(o.d.getDate()), endIndex: o.idx, range: false }));
    } else if (state.period === 'week') {
        /* 按自然周分组：标签只显示日期区间，不显示「第几周」 */
        const groups = [];
        inMonth.forEach(o => {
            const ws = weekStartOf(o.d).getTime();
            const g = groups.filter(x => x.ws === ws)[0];
            if (g) { g.endIndex = Math.max(g.endIndex, o.idx); }
            else groups.push({ ws: ws, start: weekStartOf(o.d), endIndex: o.idx });
        });
        thirds = groups.map(g => {
            const e = new Date(g.start.getFullYear(), g.start.getMonth(), g.start.getDate() + 6);   /* 周一+6=周日 */
            return { label: '(' + fmtMD(g.start) + '-' + fmtMD(e) + ')', endIndex: g.endIndex, range: true };
        });
    }
    return { years: years, months: months, thirds: thirds, y: y, m: m, t: 0 };
}

/* 把某一列画成滚轮（items: 字符串或 {label}），并滚到选中项 */
function paintWheelCol(colId, items, sel) {
    const el = document.getElementById(colId);
    if (!el) return;
    const labels = items.map(it => (it && typeof it === 'object') ? it.label : String(it));
    el.innerHTML = labels.map((t, i) => {
        const isRange = items[i] && items[i].range;
        return '<div class="wheel-item' + (isRange ? ' range' : '') + (i === sel ? ' active' : '') + '">' + t + '</div>';
    }).join('');
    el.scrollTop = sel * WHEEL_H;
}

function paintDateWheel() {
    const showThird = state.period !== 'month';        /* 月报：只选到年 / 月 */
    document.getElementById('colThird').style.display = showThird ? '' : 'none';
    paintWheelCol('colYear', dateCols.years, dateCols.years.indexOf(dateCols.y));
    paintWheelCol('colMonth', dateCols.months.map(m => pad2(m)), dateCols.months.indexOf(dateCols.m));
    if (showThird) paintWheelCol('colThird', dateCols.thirds, dateCols.t);
}

/* 滚完停下来后取最近的一行 */
function bindWheel(colId, kind) {
    const el = document.getElementById(colId);
    if (!el || el._bound) return;
    el._bound = true;
    let timer = null;
    function settle() { settleWheel(kind, Math.round(el.scrollTop / WHEEL_H)); }
    el.addEventListener('scroll', function () {
        clearTimeout(timer);
        timer = setTimeout(settle, 90);
    });
    /* 支持 scrollend 的浏览器再兜一层（惯性滚动结束后立即落定） */
    el.addEventListener('scrollend', function () { clearTimeout(timer); settle(); });
}

function settleWheel(kind, i) {
    if (kind === 'y') {
        const y = dateCols.years[i];
        if (y === undefined || y === dateCols.y) return;
        const m = dateCols.m;
        const next = buildDateCols(y, m);
        Object.assign(dateCols, next);
        paintDateWheel();
    } else if (kind === 'm') {
        const m = dateCols.months[i];
        if (m === undefined || m === dateCols.m) return;
        Object.assign(dateCols, buildDateCols(dateCols.y, m));
        paintDateWheel();
    } else {
        if (dateCols.thirds[i] === undefined || i === dateCols.t) return;
        dateCols.t = i;
        paintWheelCol('colThird', dateCols.thirds, i);
    }
}

let pickTarget = 'end';
function setPickTarget(t) {
    pickTarget = (t === 'start') ? 'start' : 'end';
    document.getElementById('ptStart').classList.toggle('active', pickTarget === 'start');
    document.getElementById('ptEnd').classList.toggle('active', pickTarget === 'end');
    openDatePicker();
}

function openDatePicker() {
    const d = dateOf(pickTarget === 'start' ? state.startIndex : state.endIndex);
    document.getElementById('ptStart').classList.toggle('active', pickTarget === 'start');
    document.getElementById('ptEnd').classList.toggle('active', pickTarget === 'end');
    Object.assign(dateCols, buildDateCols(d.getFullYear(), d.getMonth() + 1));
    /* 第三列默认选中「包含当前日期」的那一项 */
    const cur = (pickTarget === 'start' ? state.startIndex : state.endIndex);
    let t = dateCols.thirds.reduce((best, o, i) =>
        Math.abs(o.endIndex - cur) < Math.abs(dateCols.thirds[best].endIndex - cur) ? i : best, 0);
    dateCols.t = dateCols.thirds.length ? t : 0;
    bindWheel('colYear', 'y'); bindWheel('colMonth', 'm'); bindWheel('colThird', 't');
    /* 先显示再画：隐藏状态下设置 scrollTop 不生效，会让滚轮停在顶部而不是选中项 */
    document.getElementById('datePicker').classList.add('show');
    document.body.style.overflow = 'hidden';
    paintDateWheel();
    requestAnimationFrame(paintDateWheel);   /* 布局完成后校正一次选中行位置 */
}

function closeDatePicker() {
    document.getElementById('datePicker').classList.remove('show');
    document.body.style.overflow = '';
}

/* 确认：按当前三列算出 endIndex 并刷新报表（刷新前保留滚动位置） */
function confirmDatePicker() {
    let idx = null;
    if (state.period === 'month') {
        const last = windowDates().filter(o => o.d.getFullYear() === dateCols.y && o.d.getMonth() + 1 === dateCols.m).pop();
        if (last) idx = last.idx;
    } else {
        const t = dateCols.thirds[dateCols.t];
        if (t) idx = t.endIndex;
    }
    if (idx != null) {
        if (pickTarget === 'start') {
            state.startIndex = idx;
            if (state.startIndex > state.endIndex) state.endIndex = state.startIndex;
        } else {
            state.endIndex = idx;
            if (state.endIndex < state.startIndex) state.startIndex = state.endIndex;
        }
        if (state.endIndex - state.startIndex + 1 > 12) state.startIndex = state.endIndex - 11;
        if (state.startIndex < 0) state.startIndex = 0;
    }
    closeDatePicker();
    render();
}

/* 统一返回：三页行为一致 —— 有上一页就真返回，没有则提示 */
function goBack() {
    if (history.length > 1) { history.back(); return; }

function showToast(msg) {
    const t = document.createElement('div');
    t.textContent = msg;
    t.style.cssText = 'position:fixed;left:50%;bottom:60px;transform:translateX(-50%);background:rgba(0,0,0,.78);color:#fff;'
        + 'font-size:12px;padding:9px 16px;border-radius:18px;z-index:99;';

/* 骨架屏展示时长（演示用常量；真实接口接入后应由「布局 + 数据就绪」决定） */
const LOAD_MS = 3000;

/* ==================== 下拉刷新 ====================
   手势覆盖整页（顶栏 / 周期 Tab / 数据卡片都能下拉）；拉动时内容整体下移，
   刷新指示条作为浮层出现在数据卡片区域上方（不占布局、不挤压卡片）。
   与表格 / 日期条的横向拖动不冲突：首次位移偏横向时本次不接管。 */
const PTR_THRESHOLD = 56;        /* 触发刷新的下拉高度（阻尼后的视觉高度） */
const PTR_DAMP = 0.45;           /* 阻尼：手指走 2px，内容走 1px */
const PTR_MAX = 72;              /* 内容最多下移高度 */
const PTR_BAR_H = 46;            /* 指示条高度（与 CSS .ptr 一致） */
let ptrStartY = null, ptrStartX = null, ptrPull = 0, ptrDecided = false, ptrActive = false;
let ptrPullDistance = 0;         /* 阻尼后的视觉下拉高度（判断是否达阈值）*/

/* state：drag 跟手 / pull 未达阈值回弹 / ready 达阈值 / loading 刷新中 */
function applyPull(h, state) {
    const ptr = document.getElementById('ptr');
    const scr = document.getElementById('screen');
    const txt = document.getElementById('ptrText');
    document.body.classList.toggle('ptr-dragging', state === 'drag');
    if (ptr) {
        ptr.style.transform = 'translateY(' + (h - PTR_BAR_H) + 'px)';
        ptr.style.opacity = String(Math.min(1, h / 22));
        ptr.classList.toggle('ready', state === 'ready');
        ptr.classList.toggle('loading', state === 'loading');
    }
    if (scr) scr.style.transform = h ? 'translateY(' + h + 'px)' : '';
    if (txt && state !== 'loading') txt.textContent = state === 'ready' ? '释放刷新' : '下拉刷新';
}

/* 松手：够阈值就刷新，否则回弹（鼠标 / 触摸共用） */
function finishPull() {
    if (ptrStartY === null && ptrStartX === null) return;
    const wasActive = ptrActive;
    ptrStartY = null; ptrStartX = null; ptrPull = 0; ptrActive = false; ptrDecided = false;
    if (!wasActive) return;
    if (ptrPullDistance >= PTR_THRESHOLD) {
        applyPull(PTR_BAR_H, 'loading');
        const txt = document.getElementById('ptrText');
        if (txt) txt.textContent = '正在刷新…';
        /* 下拉刷新必然「网络异常」一次 → 显示缺省页；在缺省页再下拉＝重试，这次成功 */
        const willFail = state.pageState !== 'netError';
        try { sessionStorage.setItem(NET_KEY, willFail ? 'error' : 'ok'); } catch (e) {}
        setTimeout(() => location.reload(), 460);
    } else {
        applyPull(0, 'pull');                                 /* 未达阈值：回弹 */
    }
}

function bindPullToRefresh() {
    const scr = document.getElementById('screen');
    if (!scr) return;

    /* ============ 鼠标 / 触控笔：pointer 事件 ============ */
    document.addEventListener('pointerdown', e => {
        if (e.pointerType === 'touch') return;                /* 触摸由下面的 touch 通路处理 */
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        if (scr.scrollTop > 0) return;                        /* 内容不在顶部 → 不接管 */
        ptrStartY = e.clientY; ptrStartX = e.clientX;
        ptrPull = 0; ptrPullDistance = 0; ptrDecided = false; ptrActive = false;
    });

    document.addEventListener('pointermove', e => {
        if (e.pointerType === 'touch' || ptrStartY === null) return;
        const dy = e.clientY - ptrStartY, dx = e.clientX - ptrStartX;
        if (!ptrDecided) {
            if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return;   /* 轻微抖动忽略 */
            ptrDecided = true;
            ptrActive = dy > 0 && Math.abs(dy) > Math.abs(dx);  /* 竖向向下＝下拉；横向留给表格拖动 */
        }
        if (!ptrActive) return;
        ptrPull = Math.max(0, dy);
        const h = Math.min(PTR_MAX, ptrPull * PTR_DAMP);
        ptrPullDistance = h;
        applyPull(h, h >= PTR_THRESHOLD ? 'ready' : 'drag');
        if (e.cancelable) e.preventDefault();
    });

    const pointerEnd = e => { if (e.pointerType !== 'touch') finishPull(); };
    document.addEventListener('pointerup', pointerEnd);
    document.addEventListener('pointercancel', pointerEnd);

    /* ============ 触摸：浏览器原生滚动 / 下拉会「取消」pointer，必须用 touch 自己接管 ============ */
    let touchY = null;
    document.addEventListener('touchstart', e => {
        if (e.touches.length !== 1 || scr.scrollTop > 0) { touchY = null; return; }
        touchY = e.touches[0].clientY;
        ptrStartX = e.touches[0].clientX; ptrStartY = touchY;
        ptrPull = 0; ptrPullDistance = 0; ptrDecided = false; ptrActive = false;
    }, { passive: true });

    document.addEventListener('touchmove', e => {
        if (touchY === null || e.touches.length !== 1) return;
        const dy = e.touches[0].clientY - touchY;
        const dx = e.touches[0].clientX - ptrStartX;
        if (!ptrDecided) {
            if (Math.abs(dy) < 6 && Math.abs(dx) < 6) return;
            ptrDecided = true;
            ptrActive = dy > 0 && Math.abs(dy) > Math.abs(dx);  /* 竖向向下＝下拉；横向留给表格拖动 */
        }
        if (!ptrActive) { touchY = null; return; }              /* 判定为滑动内容 → 交还浏览器 */
        if (e.cancelable) e.preventDefault();                   /* 抢下这次手势，不再触发原生下拉/滚动 */
        ptrPull = Math.max(0, dy);
        const h = Math.min(PTR_MAX, ptrPull * PTR_DAMP);
        ptrPullDistance = h;
        applyPull(h, h >= PTR_THRESHOLD ? 'ready' : 'drag');
    }, { passive: false });

    const touchEnd = () => {
        if (touchY === null) return;
        touchY = null;
        finishPull();                                         /* 够阈值 → 刷新；否则回弹 */
    };
    document.addEventListener('touchend', touchEnd);
    document.addEventListener('touchcancel', touchEnd);
}

/* ==================== 分享：复制链接 / 生成分享图 ====================
   分享图用 canvas 在本机画（不依赖 html2canvas 等外部库，离线 / file:// 也能出图） */
/* 第一步：打开分享面板（只出「复制链接 / 分享图片」，不绘图） */
function openShareSheet() {
    const sheet = document.getElementById('shareSheet');
    const box = document.getElementById('shareSheetBox');
    if (!sheet) return;
    if (box) box.className = 'picker-sheet share-sheet mode-methods';
    sheet.classList.add('show');
    document.body.style.overflow = 'hidden';
}

/* 第二步：点「分享图片」→ 此刻才前端绘图，并切到分享图视图 */
function showSharePoster() {
    const box = document.getElementById('shareSheetBox');
    drawSharePoster();                       /* 按当前报表 / 设备 / 周期绘制 */
    if (box) box.className = 'picker-sheet share-sheet mode-poster';
}

function backToShareMethods() {
    const box = document.getElementById('shareSheetBox');
    if (box) box.className = 'picker-sheet share-sheet mode-methods';
}

function closeShareSheet() {
    const sheet = document.getElementById('shareSheet');
    if (sheet) sheet.classList.remove('show');

}

/* 圆角矩形（canvas 没有现成的） */
function shareRoundRect(g, x, y, w, h, r) {
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r);
    g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r);
    g.arcTo(x, y, x + w, y, r);
    g.closePath();
}

/* 把当前报表画成一张分享图（品牌头 + 报表名 / 设备 / 周期 + 两个指标 + 工时排行 + 页脚） */
function drawSharePoster() {
    const cv = document.getElementById('shareCanvas');
    if (!cv) return;
    const g = cv.getContext('2d');
    const W = cv.width, H = cv.height;
    const F = '"PingFang SC", "Microsoft YaHei", Arial, sans-serif';
    const ids = selIds();
    const m = MACHINES.filter(x => x.id === ids[0])[0] || MACHINES[0];
    const runHours = periodIdxs().reduce((s, i) => s + (hoursOf(i) || 0), 0);
    const fuel = periodIdxs().reduce((s, i) => s + (fuelOf(i) || 0), 0);
    const name = (document.getElementById('reportTitle') || {}).textContent || '报表';

    g.clearRect(0, 0, W, H);
    g.fillStyle = '#fff'; g.fillRect(0, 0, W, H);
    g.textAlign = 'left'; g.textBaseline = 'alphabetic';

    /* 品牌头 */
    g.fillStyle = '#E60012'; g.fillRect(0, 0, W, 148);
    g.fillStyle = '#fff';
    g.font = '700 42px ' + F;
    g.fillText('SANY 三一重工', 48, 70);
    g.font = '400 28px ' + F;
    g.fillText('报表分享 · 移动端', 48, 116);

    /* 报表名（过长裁剪，避免压出画面） */
    g.save();
    g.beginPath(); g.rect(48, 186, W - 96, 58); g.clip();
    g.fillStyle = '#161a2e'; g.font = '700 44px ' + F;
    g.fillText(name, 48, 230);
    g.restore();

    /* 设备 / 周期 */
    g.fillStyle = '#8b90a0'; g.font = '400 26px ' + F;
    const hitGroup = deviceGroups.filter(x => sameIds(x.machines, ids))[0];
    g.fillText('设备：' + (hitGroup
        ? '分组 ' + hitGroup.name + '（' + ids.length + ' 台）'
        : ids.length > 1 ? ids.length + ' 台设备（机群）'
            : m.name + '（编号：' + m.model + '）'), 48, 284);
    g.fillText('周期：' + periodLabel() + ' · ' + PERIOD_VIEW[state.period].name, 48, 326);

    /* 两个指标块 */
    [['发动机运行时长', hm(runHours) + ' h'], ['燃油消耗', fmt(fuel, 1) + ' L']].forEach((k, i) => {
        const x = 48 + i * 324, y = 368;
        g.fillStyle = '#f7f8fa'; shareRoundRect(g, x, y, 300, 132, 18); g.fill();
        g.fillStyle = '#161a2e'; g.font = '700 40px ' + F; g.fillText(k[1], x + 26, y + 62);
        g.fillStyle = '#8b90a0'; g.font = '400 24px ' + F; g.fillText(k[0], x + 26, y + 102);
    });

    /* 工时排行（与页面同口径：机群柱状图＝设备排行榜，时间塌缩为当前周期合计；
       分享图版面有限 → 取前 5 台，刻度用设备名称） */
    const bk = hourRanking().slice(0, 5);
    const max = Math.max.apply(null, bk.map(r => r.value)) || 1;
    g.fillStyle = '#161a2e'; g.font = '700 30px ' + F; g.fillText('工时排行（前 5 台）', 48, 572);
    const base = 806, top = 620, colW = (W - 96) / Math.max(bk.length, 1);
    bk.forEach((r, i) => {
        const bh = Math.max(6, Math.round((r.value / max) * (base - top)));
        const bw = colW * 0.62, x = 48 + i * colW + (colW - bw) / 2;
        g.fillStyle = '#E60012'; shareRoundRect(g, x, base - bh, bw, bh, 6); g.fill();
        g.fillStyle = '#a0a4ad'; g.font = '400 20px ' + F; g.textAlign = 'center';
        g.fillText(shortDevName(r.name), x + bw / 2, base + 32);
    });
    g.textAlign = 'left';

    /* ===== 底部引导区（参考拼多多 / 淘宝分享图：品牌 + 引导文案 + 二维码） ===== */
    const bandY = 890;
    g.strokeStyle = '#eef0f3'; g.lineWidth = 2;
    g.beginPath(); g.moveTo(48, bandY - 14); g.lineTo(W - 48, bandY - 14); g.stroke();
    g.fillStyle = '#f7f8fa'; g.fillRect(0, bandY, W, H - bandY);

    /* 左侧品牌方块（与右侧二维码在同一水平中线） */
    g.fillStyle = '#E60012'; shareRoundRect(g, 48, bandY + 52, 68, 68, 16); g.fill();
    g.fillStyle = '#fff'; g.font = '700 24px ' + F; g.textAlign = 'center';
    g.fillText('三一', 48 + 34, bandY + 94);
    g.textAlign = 'left';

    /* 引导文案 */
    g.fillStyle = '#5a6472'; g.font = '600 26px ' + F;
    g.fillText('长按识别二维码', 136, bandY + 82);
    g.fillStyle = '#a0a4ad'; g.font = '400 22px ' + F;
    g.fillText('查看报表详情与历史数据', 136, bandY + 122);

    /* 右下角二维码（示例图案，按链接生成，稳定不变） */
    drawShareQrPlaceholder(g, W - 48 - 156, bandY + 12, 156, location.href);
}

/* 示例二维码（不可扫）：按文本生成稳定黑白块 + 三个定位角，仅作视觉占位 */
function drawShareQrPlaceholder(g, x, y, size, seedText) {
    const N = 25, m = size / N;                       /* 25×25 模块，看起来像 Version 2 */
    let seed = 7;
    for (let i = 0; i < seedText.length; i++) seed = (seed * 31 + seedText.charCodeAt(i)) % 2147483647;
    const rnd = () => (seed = (seed * 1103515245 + 12345) % 2147483647) / 2147483647;

    g.fillStyle = '#fff';                             /* 白底 + 留白（二维码静区） */
    shareRoundRect(g, x - 10, y - 10, size + 20, size + 20, 10); g.fill();
    g.strokeStyle = '#eef0f3'; g.lineWidth = 2; g.stroke();

    const inFinder = (r, c) => (r < 7 && c < 7) || (r < 7 && c >= N - 7) || (r >= N - 7 && c < 7);
    g.fillStyle = '#161a2e';
    for (let r = 0; r < N; r++) {
        for (let c = 0; c < N; c++) {
            if (inFinder(r, c)) continue;
            if (rnd() > 0.55) g.fillRect(x + c * m, y + r * m, m, m);
        }
    }
    /* 三个定位角：7×7 黑 → 5×5 白 → 3×3 黑 */
    [[0, 0], [0, N - 7], [N - 7, 0]].forEach(function (p) {
        const r0 = p[0], c0 = p[1];
        g.fillStyle = '#161a2e'; g.fillRect(x + c0 * m, y + r0 * m, m * 7, m * 7);
        g.fillStyle = '#fff';    g.fillRect(x + (c0 + 1) * m, y + (r0 + 1) * m, m * 5, m * 5);
        g.fillStyle = '#161a2e'; g.fillRect(x + (c0 + 2) * m, y + (r0 + 2) * m, m * 3, m * 3);
    });
}

/* 复制链接：优先 Clipboard API，失败回退 execCommand（file:// 或 iframe 里可能被限制） */
function copyShareLink() {
    const link = location.href;
    const ok = () => { closeShareSheet(); showToast('链接已复制，粘贴即可分享'); };
    const fallback = () => {
        try {
            const ta = document.createElement('textarea');
            ta.value = link;
            ta.style.cssText = 'position:fixed;left:-9999px;top:0;';
            document.body.appendChild(ta);
            ta.select();
            const done = document.execCommand('copy');
            ta.remove();
            done ? ok() : showToast('复制失败，请长按地址栏复制');
        } catch (e) { showToast('复制失败，请长按地址栏复制'); }
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(link).then(ok).catch(fallback);
    } else { fallback(); }
}

/* 保存分享图：下载 PNG（移动端不支持下载时，提示长按图片保存） */
function saveShareImage() {
    const cv = document.getElementById('shareCanvas');
    if (!cv) return;
    const name = ((document.getElementById('reportTitle') || {}).textContent || '报表') + '-分享图.png';
    try {
        const a = document.createElement('a');
        a.href = cv.toDataURL('image/png');
        a.download = name;
        document.body.appendChild(a);
        a.click();
        a.remove();
        showToast('分享图已保存');
    } catch (e) {
        showToast('长按图片即可保存到相册');
    }
}

/* ==================== 初始化 ==================== */
/* 顶栏标题 = 从机群报表点进来的那张报表名称（?report=xxx / #report=xxx）
   未带参数（直接打开本页）时兜底「单机报表」 */
(function applyReportName() {
    let name = '';
    try { name = new URLSearchParams(location.search).get('report') || ''; } catch (e) { name = ''; }
    if (!name) {
        const m = /(?:^|[#&?])report=([^&]+)/.exec(location.hash || '');
        if (m) { try { name = decodeURIComponent(m[1]); } catch (e) { name = m[1]; } }
    }
    if (!name) return;
    const t = document.getElementById('reportTitle');
    if (t) t.textContent = name;
    document.title = '机群数据-机群';
})();

/* 遮罩下沿对齐内容区起点：顶部标题 / 提示条 / 设备与日期 / 周期 Tab 先直接显示出来 */
(function alignOverlayTop() {
    const scr = document.getElementById('screen');
    if (!scr) return;
    const top = scr.offsetTop + 'px';
    const mask = document.getElementById('loadingMask');
    const layer = document.getElementById('ptrLayer');
    if (mask) mask.style.top = top;
    if (layer) layer.style.top = top;      /* 刷新浮层与内容区同起点 */
})();

/* 上一次下拉刷新留下的结果标记：error = 本次进页面展示「网络异常」缺省页 */
const NET_KEY = 'mysany_single_report_net';
try {
    if (sessionStorage.getItem(NET_KEY) === 'error') state.pageState = 'netError';
    sessionStorage.removeItem(NET_KEY);          /* 用完即清，避免一直卡在异常态 */
} catch (e) { /* 存储不可用时按正常态 */ }

paintSkeleton();   /* 先按配置画骨架，再渲染真内容 */
render();
bindPullToRefresh();
bindGroupPress();  /* 分组快捷条：长按 / 右键 → 编辑、删除 */

/* 首屏加载效果：渲染已完成，淡出并移除遮罩
   （performance.now() = 从导航开始算起的毫秒数；骨架展示 LOAD_MS 后淡出） */
(function hideLoading() {
    const mask = document.getElementById('loadingMask');
    if (!mask) return;
    const wait = Math.max(0, LOAD_MS - performance.now());
    setTimeout(() => {
        mask.classList.add('hide');
        setTimeout(() => mask.remove(), 320);
    }, wait);
})();
</script>
